name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: RuntimeAssetImportPlugin
          fetch-depth: 0
          submodules: recursive

      - name: Remove stale sample plugin junction
        shell: powershell
        run: |
          $linkPath = Join-Path $env:GITHUB_WORKSPACE "RuntimeAssetImportSample\Plugins\RuntimeAssetImport"
          $linkItem = Get-Item -LiteralPath $linkPath -Force -ErrorAction SilentlyContinue
          if ($null -eq $linkItem) {
            Write-Host "No stale sample plugin path found: $linkPath"
          } elseif (-not $linkItem.PSIsContainer) {
            throw "Refusing to replace non-directory sample plugin path: $linkPath"
          } elseif (($linkItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            Write-Host "Removing stale sample plugin junction: $linkPath"
            [System.IO.Directory]::Delete($linkPath, $false)
            if ($null -ne (Get-Item -LiteralPath $linkPath -Force -ErrorAction SilentlyContinue)) {
              throw "Stale sample plugin junction remained after deletion: $linkPath"
            }
          } else {
            Write-Host "Preserving regular sample plugin directory for actions/checkout: $linkPath"
          }

      - name: Checkout test host project
        uses: actions/checkout@v6
        with:
          repository: metyatech/RuntimeAssetImportSample
          ref: b4c78058993e68a62fc9c16b673aec65ee668573
          path: RuntimeAssetImportSample
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Fab release tools
        uses: actions/checkout@v6
        with:
          repository: metyatech/fab-plugin-release-tools
          ref: de784111d9e88a3e13205494aa56ccb12a8740f3
          path: fab-plugin-release-tools
          fetch-depth: 1

      - name: Link plugin into test project
        shell: powershell
        run: |
          $pluginPath = Join-Path $env:GITHUB_WORKSPACE "RuntimeAssetImportPlugin"
          $linkPath   = Join-Path $env:GITHUB_WORKSPACE "RuntimeAssetImportSample\Plugins\RuntimeAssetImport"
          $resolvedWorkspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          $resolvedLinkPath = [System.IO.Path]::GetFullPath($linkPath)
          if (-not $resolvedLinkPath.StartsWith($resolvedWorkspace + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to replace path outside GITHUB_WORKSPACE: $resolvedLinkPath"
          }
          $linkItem = Get-Item -LiteralPath $resolvedLinkPath -Force -ErrorAction SilentlyContinue
          if ($null -ne $linkItem -and -not $linkItem.PSIsContainer) {
            throw "Refusing to replace non-directory plugin link path: $resolvedLinkPath"
          }
          if ($null -ne $linkItem -and
              (($linkItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0)) {
            [System.IO.Directory]::Delete($resolvedLinkPath, $false)
            if ($null -ne (Get-Item -LiteralPath $resolvedLinkPath -Force -ErrorAction SilentlyContinue)) {
              throw "Plugin junction remained after deletion: $resolvedLinkPath"
            }
          } elseif ($null -ne $linkItem) {
            [System.IO.Directory]::EnumerateFiles($resolvedLinkPath, '*', [System.IO.SearchOption]::AllDirectories) | ForEach-Object {
              [System.IO.File]::SetAttributes($_, [System.IO.FileAttributes]::Normal)
            }
            [System.IO.Directory]::Delete($resolvedLinkPath, $true)
          }
          New-Item -ItemType Junction -Path $linkPath -Target $pluginPath
          Write-Host "Linked: $linkPath -> $pluginPath"

      - name: Verify plugin checkout integrity before build
        shell: powershell
        run: |
          $pluginPath = Join-Path $env:GITHUB_WORKSPACE "RuntimeAssetImportPlugin"
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) {
            throw 'GITHUB_SHA is empty; cannot verify the plugin checkout commit.'
          }
          $pluginHead = (git -C $pluginPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the plugin checkout HEAD.'
          }
          if ($pluginHead -cne $env:GITHUB_SHA) {
            throw "Plugin checkout was modified by another checkout: expected $env:GITHUB_SHA but found $pluginHead."
          }
          $trackedChanges = git -C $pluginPath status --porcelain=v1 --untracked-files=no
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect tracked changes in the plugin checkout.'
          }
          $trackedChangesText = ($trackedChanges -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($trackedChangesText)) {
            throw "Plugin checkout has tracked changes before Verify:`n$trackedChangesText"
          }
          Write-Host "Plugin checkout integrity verified at $pluginHead with no tracked changes."

      - name: Verify (build + test)
        shell: powershell
        working-directory: RuntimeAssetImportSample
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\Verify.ps1 -TestFilter "RuntimeAssetImport"

      - name: Validate Fab package
        shell: powershell
        working-directory: RuntimeAssetImportPlugin
        run: |
          $releaseOutput = Join-Path $env:RUNNER_TEMP 'RuntimeAssetImport-Fab-UE5.4'
          $runnerTempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $resolvedReleaseOutput = [System.IO.Path]::GetFullPath($releaseOutput).TrimEnd('\', '/')
          if ($resolvedReleaseOutput.Equals($runnerTempRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not $resolvedReleaseOutput.StartsWith($runnerTempRoot + [System.IO.Path]::DirectorySeparatorChar,
                  [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to use release output outside RUNNER_TEMP: $resolvedReleaseOutput"
          }
          if ([System.IO.Directory]::Exists($resolvedReleaseOutput)) {
            foreach ($file in [System.IO.Directory]::EnumerateFiles($resolvedReleaseOutput, '*',
                    [System.IO.SearchOption]::AllDirectories)) {
              [System.IO.File]::SetAttributes($file, [System.IO.FileAttributes]::Normal)
            }
            [System.IO.Directory]::Delete($resolvedReleaseOutput, $true)
          }
          [void][System.IO.Directory]::CreateDirectory($resolvedReleaseOutput)

          pwsh -NoProfile -File .\PackageForFab.ps1 `
            -EngineVersion 5.4 `
            -ReleaseToolsRoot (Join-Path $env:GITHUB_WORKSPACE 'fab-plugin-release-tools') `
            -OutputDirectory $resolvedReleaseOutput
          if ($LASTEXITCODE -ne 0) {
            throw "PackageForFab.ps1 failed with exit code $LASTEXITCODE"
          }

          $zipFiles = @([System.IO.Directory]::GetFiles($resolvedReleaseOutput, '*.zip',
                  [System.IO.SearchOption]::TopDirectoryOnly))
          $checksumFiles = @([System.IO.Directory]::GetFiles($resolvedReleaseOutput, '*.zip.sha256',
                  [System.IO.SearchOption]::TopDirectoryOnly))
          $reportFiles = @([System.IO.Directory]::GetFiles($resolvedReleaseOutput, '*.zip.report.json',
                  [System.IO.SearchOption]::TopDirectoryOnly))
          $logFiles = @([System.IO.Directory]::GetFiles($resolvedReleaseOutput, '*.zip.log',
                  [System.IO.SearchOption]::TopDirectoryOnly))
          if ($zipFiles.Count -ne 1 -or $checksumFiles.Count -ne 1 -or
              $reportFiles.Count -ne 1 -or $logFiles.Count -ne 1) {
            throw 'Fab release output must contain exactly one ZIP and each of its three sidecars.'
          }
          $zipPath = $zipFiles[0]
          $zipName = [System.IO.Path]::GetFileName($zipPath)
          $pluginHead = (git -C (Join-Path $env:GITHUB_WORKSPACE 'RuntimeAssetImportPlugin') rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the CI plugin checkout HEAD.' }
          $report = Get-Content -Raw -LiteralPath $reportFiles[0] | ConvertFrom-Json
          if ($report.status -cne 'PASS' -or [string]$report.toolVersion -cne '0.3.1' -or
              [string]$report.repositoryHead -cne $pluginHead -or
              @($report.gates).Count -ne 12 -or
              @($report.gates | Where-Object { $_.status -cne 'PASS' }).Count -ne 0) {
            throw 'Fab release report failed the CI contract checks.'
          }
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumText = [System.IO.File]::ReadAllText($checksumFiles[0]).TrimEnd("`r", "`n")
          $checksumMatch = [System.Text.RegularExpressions.Regex]::Match(
            $checksumText, '^(?<Hash>[0-9a-f]{64})  (?<Name>[^\r\n]+)$')
          if (-not $checksumMatch.Success -or $checksumMatch.Groups['Hash'].Value -cne $actualHash -or
              $checksumMatch.Groups['Name'].Value -cne $zipName) {
            throw 'Fab release checksum sidecar does not match the generated ZIP.'
          }
          if ([System.IO.Path]::GetFileName([string]$report.outputZip) -cne $zipName) {
            throw 'Fab release report outputZip does not match the generated ZIP.'
          }

      - name: Upload Fab release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RuntimeAssetImport-Fab-UE5.4
          path: ${{ runner.temp }}/RuntimeAssetImport-Fab-UE5.4/*
          if-no-files-found: error
